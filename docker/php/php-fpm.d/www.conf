[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data

; Process manager dynamic tuning for AWS EC2 (t3.small 2GB / t3.medium 4GB)
; Average Laravel PHP worker RAM: ~35-45MB. 12 workers * ~40MB = ~480MB
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN:-12}
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; FastCGI Healthcheck ping endpoint
ping.path = /ping
ping.response = pong

request_terminate_timeout = 60s
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
