services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: tuntas
    restart: unless-stopped
    ports:
      - "80:8000"
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/html/.env
      - app-storage:/var/www/html/storage
    networks:
      - tuntas-network

networks:
  tuntas-network:
    driver: bridge

volumes:
  app-storage:
