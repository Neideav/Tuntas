services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: tuntas
    restart: unless-stopped
    ports:
      - "${PORT:-80}:3000"
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/html/.env:ro
      - app-storage:/var/www/html/storage
      - app-bootstrap-cache:/var/www/html/bootstrap/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tuntas-network

networks:
  tuntas-network:
    driver: bridge

volumes:
  app-storage:
  app-bootstrap-cache:
