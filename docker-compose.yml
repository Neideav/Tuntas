services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tuntas
    restart: unless-stopped
    ports:
      - "80:8000"
      - "3000:3000"
    volumes:
      - ./.env:/var/www/html/.env
      - app-storage:/var/www/html/storage
    networks:
      - tuntas-network

networks:
  tuntas-network:
    driver: bridge

volumes:
  app-storage:
